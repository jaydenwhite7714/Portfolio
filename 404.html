<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Page not found — Jayden White</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#07080d" />
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="assets/css/core.css" />
<style>
  body { display: grid; place-items: center; min-height: 100vh; padding: 24px; }
  .nf {
    position: relative;
    max-width: 560px;
    width: 100%;
    text-align: center;
    padding: 54px 34px;
    border-radius: var(--r-xl);
    border: 1px solid var(--line);
    background: radial-gradient(420px 220px at 50% 0%, rgba(139, 123, 255, 0.16), transparent 70%),
      linear-gradient(180deg, rgba(20, 24, 36, 0.9), rgba(10, 12, 19, 0.9));
    box-shadow: 0 50px 100px -50px rgba(0, 0, 0, 0.9);
  }
  .nf__code {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--muted-2);
    margin-bottom: 18px;
  }
  .nf h1 {
    font-family: var(--display);
    font-size: clamp(1.9rem, 6vw, 2.7rem);
    font-weight: 700;
    letter-spacing: -0.04em;
    line-height: 1.05;
    margin-bottom: 14px;
  }
  .nf p { color: var(--muted); font-size: 14.5px; line-height: 1.7; margin-bottom: 26px; }
  .nf__actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .nf__mark {
    width: 60px; height: 60px;
    margin: 0 auto 22px;
    border-radius: 18px;
    background: linear-gradient(135deg, #8b7bff, #38e2c8);
    display: grid;
    place-items: center;
    font-family: var(--display);
    font-weight: 800;
    font-size: 24px;
    color: #080a10;
    box-shadow: 0 18px 40px -16px rgba(139, 123, 255, 0.9);
  }
</style>
</head>
<body>
  <main class="nf">
    <div class="nf__mark" aria-hidden="true">JW</div>
    <p class="nf__code">Error 404</p>
    <h1>This frame doesn't exist.</h1>
    <p>Even the best laid-out UI has a missing element now and then. The page you were after isn't here — but the portfolio is.</p>
    <div class="nf__actions">
      <a class="btn btn--primary" href="./">Back to the portfolio</a>
      <a class="btn btn--ghost" href="./#lab">Open the UI Lab</a>
    </div>
  </main>
</body>
</html>
